<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243b42"><title>快递站老板</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game" aria-label="快递站老板">
<header><div><strong id="station">梧桐街小站</strong><span id="day">第 1 天</span></div><div class="wallet"><i class="px-item coin"></i><b id="cash">80</b></div><button id="menu" aria-label="暂停与设置">Ⅱ</button></header>
<div id="progress"><span id="shift-status">准备营业</span><span id="reputation"></span></div>
<section id="yard" aria-label="快递流水线"><canvas width="390" height="520" id="scene" aria-hidden="true"></canvas><div id="departures"><div class="dispatch-slot"><span class="dispatch-gain" aria-live="polite"></span><button data-dispatch="0" disabled><b>待装车</b><small></small></button></div><div class="dispatch-slot"><span class="dispatch-gain" aria-live="polite"></span><button data-dispatch="1" disabled><b>待装车</b><small></small></button></div><div class="dispatch-slot"><span class="dispatch-gain" aria-live="polite"></span><button data-dispatch="2" disabled><b>待装车</b><small></small></button></div></div><div id="stations"><button data-role="sort"><b>分拣 · 1人</b><small>待处理 0</small></button><button data-role="pack"><b>包装 · 1人</b><small>待处理 0</small></button><button data-role="load"><b>装车 · 1人</b><small>待处理 0</small></button></div></section>
<footer><div class="staff-heading"><span id="selection">包装岗 · 1人</span><button id="edit-order" hidden>改订单</button><button id="main-action">选择订单</button></div><div id="staff-controls" aria-label="调配人员"></div></footer>
<dialog id="sheet"><div id="sheet-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
</main><script type="module" src="js/app.js"></script></body></html>
