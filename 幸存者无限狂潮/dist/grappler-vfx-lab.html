<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英雄 · 战斗特效演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d171c;color:#ecf2eb;font:15px/1.5 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:20px}header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}h1{font-size:24px;margin:0}header p{color:#9eb2b8;margin:4px 0 16px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button,select,a{border:0;border-radius:7px;font:inherit;min-height:44px;padding:10px 15px}button{background:#2c414b;color:#e3eff2;cursor:pointer}button[aria-pressed=true]{background:#dfad63;color:#201a14;font-weight:700}button:disabled{background:#283036;color:#899198;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:0;filter:brightness(1.3);text-decoration:underline;text-underline-offset:4px}select{background:#263b46;color:#fff}label{display:flex;align-items:center;gap:8px}.stage{background:#081115;border-radius:12px;overflow:hidden}canvas{width:100%;height:min(56vw,540px);display:block}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#1b2d35}.stage:fullscreen canvas{height:calc(100dvh - 60px);width:100vw}#fullscreen{padding:6px 12px}#action{color:#f6c77b}#description{min-height:46px;color:#bfd0d3}a{display:inline-flex;align-items:center;color:#d1dee4;background:#23343d;text-decoration:none}#status{font-size:13px;color:#b1c6cb}#weapon{display:none}#weapon.visible{display:flex}#error{color:#ffb6a3}@media(max-height:480px){main{padding:8px 12px}header h1{font-size:18px}header p{font-size:12px;margin:0}header{margin-bottom:6px}.controls{margin-bottom:6px;gap:6px}button,select,a{padding:6px 12px}canvas{height:calc(100dvh - 174px);min-height:145px}#description{min-height:0;font-size:12px;margin:5px 0}footer{padding:4px 12px}#status{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<main>
<header><h1>英雄 · 战斗特效演示</h1><p>两个主动 + 自动普攻 · 三阶与武器进化</p></header>
<div class="controls"><label>英雄<select id="hero" aria-label="英雄"></select></label></div><div class="controls" id="tiers" aria-label="职业阶层">
<button data-job="brawler" aria-pressed="true">一阶 · 拳斗士</button><button data-job="grappler" aria-pressed="false">二阶 · 魔手斗士</button><button data-job="titan_grappler" aria-pressed="false">三阶 · 巨擘战将</button>
</div>
<div class="controls" id="actions" aria-label="攻击动作">
<span id="moves" class="controls"><button data-action="basic" aria-pressed="true">普攻</button><button data-action="grappleHook" aria-pressed="false">Q · 抓取</button><button data-action="grappleClash" aria-pressed="false">E · 投掷</button>
</span><label>速度<select id="speed" aria-label="播放速度"><option value="1">正常</option><option value="0.35">慢放 0.35×</option></select></label>
<button id="replay">重播</button><button id="pause">暂停</button>
</div>
<div class="controls visible" id="weapon" aria-label="局内普攻等级">
<label>场景<select id="scenario" aria-label="普攻演示场景"><option value="formation">动作拆解</option><option value="pressure">覆盖拆解 · 无伤72敌</option><option value="survival">真实受伤 · 站立24秒</option><option value="survival-orbit">真实受伤 · 移动24秒</option></select></label>
<button data-rank="1" aria-pressed="true">普攻 Ⅰ</button><button data-rank="2" aria-pressed="false">Ⅱ</button><button data-rank="3" aria-pressed="false">Ⅲ</button><button data-rank="a" aria-pressed="false">Ⅳ A</button><button data-rank="b" aria-pressed="false">Ⅳ B</button>
</div>
<div class="stage"><canvas aria-label="英雄实际战斗特效演示"></canvas><footer><span id="action">准备素材…</span><span id="status" role="status">加载中</span><button id="fullscreen">放大观看</button></footer></div>
<p id="description"></p><p id="error" role="alert"></p>
<a href="/#/hero">返回游戏</a>
</main>
<script type="module" src="./grappler-vfx-lab.js"></script>
</html>
