<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>午夜酒馆 v15.0</title>
  <meta name="description" content="午夜酒馆 v15.0：无框实景剧场 HD-2D 战斗样板 + 8大主题包。" />
  <meta property="og:title" content="午夜酒馆 v15.0" />
  <meta property="og:description" content="午夜酒馆 v15.0：无框实景剧场 HD-2D 战斗样板 + 8大主题包。" />
  <link rel="preload" href="./assets/fonts/fusion-pixel-12px-proportional-zh_hans.ttf.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./css/v13.css?v=187" />
  <link rel="stylesheet" href="./css/v14.css?v=233" />
</head>
<body>
  <div id="viewport">
    <div id="stage">

      <!-- ═══ TITLE SCREEN: PROCEDURAL PIXEL-ART ECLIPSE SANCTUM & MIRROR LAKE ═══ -->
      <section id="title-screen-view">
        <canvas id="title-fx-canvas" width="1280" height="720"></canvas>
        <div class="title-vignette" aria-hidden="true"></div>

        <div class="title-top-utils">
          <button id="btn-title-hands" class="title-util-btn">卡池图鉴</button>
          <button id="btn-title-mute" class="title-util-btn">音效：开</button>
        </div>

        <div class="title-hero-overlay">
          <div class="title-brand-block">
            <div class="title-emblem-row" aria-hidden="true">
              <span class="te-rule"></span>
              <svg class="te-eclipse-svg" viewBox="0 0 18 18" shape-rendering="crispEdges">
                <rect x="7" y="1" width="4" height="2" fill="#f6ce6b"/>
                <rect x="4" y="2" width="3" height="2" fill="#f6ce6b"/>
                <rect x="11" y="2" width="3" height="2" fill="#c9862c"/>
                <rect x="2" y="4" width="2" height="3" fill="#f6ce6b"/>
                <rect x="14" y="4" width="2" height="3" fill="#c9862c"/>
                <rect x="1" y="7" width="2" height="4" fill="#fff6d0"/>
                <rect x="15" y="7" width="2" height="4" fill="#a86820"/>
                <rect x="2" y="11" width="2" height="3" fill="#f6ce6b"/>
                <rect x="14" y="11" width="2" height="3" fill="#a86820"/>
                <rect x="4" y="14" width="3" height="2" fill="#d99a3a"/>
                <rect x="11" y="14" width="3" height="2" fill="#8f5418"/>
                <rect x="7" y="15" width="4" height="2" fill="#c9862c"/>
                <rect x="8" y="8" width="2" height="2" fill="#fff9df"/>
              </svg>
              <span class="te-rule"></span>
            </div>
            <h1 class="ts-main-title">
              <span class="ts-title-shadow" aria-hidden="true">午夜酒馆</span>
              <span class="ts-title-fill">午夜酒馆</span>
            </h1>
            <p class="ts-sub-line">
              <span class="ts-en">MIDNIGHT TAVERN</span>
              <span class="ts-sep" aria-hidden="true">·</span>
              <span class="ts-cn">日蚀战团</span>
            </p>
          </div>

          <div class="title-door-actions">
            <button id="btn-title-enter" class="title-enter-seal">
              <svg class="te-cursor-svg" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">
                <rect x="2" y="1" width="2" height="10" fill="#ffe89c"/>
                <rect x="4" y="2" width="2" height="8" fill="#f6c75c"/>
                <rect x="6" y="3" width="2" height="6" fill="#e5a33d"/>
                <rect x="8" y="4" width="2" height="4" fill="#fff6d0"/>
                <rect x="10" y="5" width="2" height="2" fill="#ffffff"/>
              </svg>
              <span class="te-main">推门入座</span>
              <span class="te-hint" aria-hidden="true">ENTER</span>
            </button>
            <div id="title-saved-slot" class="title-saved-slot"></div>
          </div>
        </div>
      </section>

      <!-- ═══ BEAT 1: OUTDOOR MIRROR-LAKE 4-ROUND ACTIVE-BOSS BATTLE ═══ -->
      <div id="battle-view" class="hidden">
        <canvas id="battle-canvas" width="1280" height="720"></canvas>

        <div id="battle-top-bar">
          <div class="bt-squad-box steel-panel">
            <div class="bt-sq-head">
              <span id="bt-title">W1/8 · 第 1/4 回合</span>
              <span id="bt-squad-hp-text">小队 100/100</span>
            </div>
            <div class="bt-sq-bar-wrap">
              <div class="squad-hp-track">
                <div id="bt-squad-hp-lag" class="squad-hp-lag" style="width:100%"></div>
                <div id="bt-squad-hp-fill" style="width:100%"></div>
                <div id="bt-squad-shield-fill" style="width:0%"></div>
              </div>
            </div>
          </div>

          <div class="bt-boss-box steel-panel">
            <div class="bt-boss-head">
              <span id="bt-boss-name">Boss</span>
              <span id="bt-boss-hp-text">0 / 0</span>
            </div>
            <div id="bt-boss-hp-bar"></div>
          </div>

          <div class="bt-tools-box">
            <button id="btn-bt-roster" class="steel-btn hud-mini-btn">牌组</button>
            <button id="btn-bt-hands" class="steel-btn hud-mini-btn">图鉴</button>
            <button id="bt-speed-btn" class="steel-btn" aria-label="战斗速度 1 倍">1×</button>
            <button id="btn-bt-home" class="steel-btn hud-mini-btn bt-home-btn" title="返回游戏首页（保留本波进度）">首页</button>
          </div>
        </div>

        <div id="bt-relic-chain" class="steel-panel"></div>

        <div id="bt-forecast-bar" class="bt-forecast-bar v14-forecast">
          <div class="fc-piles">
            <button id="btn-draw-pile" class="steel-btn pile-btn">抽牌 <b>2</b></button>
            <button id="btn-discard-pile" class="steel-btn pile-btn">弃牌 <b>0</b></button>
          </div>
          <div id="fc-core-content" style="display:flex;align-items:center;justify-content:space-between;flex:1;gap:10px;"></div>
        </div>

        <div id="v14-card-tip" class="v14-body-text hidden"></div>
        <div id="v14-slots-bar"></div>

        <section id="bt-hand-dock" class="bottom-dock steel-panel">
          <button id="btn-bt-discard" class="steel-btn gold dock-wing-btn"></button>
          <button id="btn-shadow-box" class="shadow-box-slot empty hidden"></button>
          <div id="bt-cards-row"></div>
          <button id="btn-bt-strike" class="steel-btn crimson dock-wing-btn"></button>
        </section>

        <div id="battle-live-telemetry" class="steel-panel hidden">
          <div id="bt-hand-pill"></div>
          <div id="bt-chain-stats"></div>
        </div>
        <canvas id="battle-overlay-canvas" width="1280" height="720"></canvas>
      </div>

      <!-- ═══ BEAT 2: FULL-SCREEN WALNUT TAVERN TABLETOP & UNIFIED BAIZE MARKET ═══ -->
      <div id="tavern-view">
        <canvas id="altar-bg-canvas" width="1280" height="720"></canvas>

        <!-- Sculpted Riveted Brass & Walnut Top Ledger Beam (72px) -->
        <header id="top-hud" class="tavern-top-beam hidden">
          <div class="hud-stats-cluster">
            <div class="hud-plaque wave">
              <span class="hud-plaque-lbl">波次</span>
              <b id="hud-wave">W2/8</b>
            </div>
            <div class="hud-plaque hearts">
              <div id="hud-hearts" class="hud-hearts-row" aria-label="剩余气血"></div>
            </div>
            <div class="hud-plaque gold">
              <svg class="hud-coin-svg" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
                <rect x="5" y="1" width="6" height="14" fill="#3a1c06"/>
                <rect x="3" y="2" width="10" height="12" fill="#3a1c06"/>
                <rect x="2" y="4" width="12" height="8" fill="#3a1c06"/>
                <rect x="1" y="5" width="14" height="6" fill="#3a1c06"/>
                <rect x="5" y="2" width="6" height="12" fill="#d48c1d"/>
                <rect x="3" y="3" width="10" height="10" fill="#f0b636"/>
                <rect x="2" y="5" width="12" height="6" fill="#f0b636"/>
                <rect x="4" y="3" width="5" height="2" fill="#fff3b0"/>
                <rect x="3" y="5" width="2" height="4" fill="#ffe680"/>
                <rect x="7" y="5" width="2" height="6" fill="#9c590c"/>
                <rect x="6" y="6" width="1" height="4" fill="#fff5c0"/>
                <rect x="9" y="9" width="3" height="2" fill="#a8620e"/>
              </svg>
              <div class="hud-gold-stack">
                <b id="hud-gold">18G</b>
              </div>
            </div>
          </div>

          <div id="top-relic-rack" class="tavern-relic-rack"></div>

          <div class="hud-tools-cluster">
            <button class="steel-btn tavern-btn hud-mini-btn" id="btn-hands-open">卡池图鉴</button>
            <button class="steel-btn tavern-btn hud-mini-btn" id="btn-mute">音效</button>
            <button class="steel-btn tavern-btn hud-mini-btn" id="btn-restart">重开</button>
            <button class="steel-btn tavern-btn hud-mini-btn" id="btn-tavern-home" title="返回游戏首页（进度已自动保存）">首页</button>
          </div>
        </header>

        <!-- Tap-to-Inspect Equipped Relic Floating Strip -->
        <div id="relic-inspect-bar" class="tavern-inspect-strip hidden"></div>

        <!-- UNBOXED FULL-TABLETOP LAYOUT: Pinned Parchment + Free-Roaming Squad | Unified Baize Market Mat -->
        <main id="market-main-stage" class="tabletop-stage hidden">
          <!-- LEFT WALNUT SIDE: Pinned Parchment Wanted Poster + Wax-Seal Battle Stamp + Open Roaming Squad Floor -->
          <aside class="tabletop-left-zone">
            <div class="bounty-contract-assembly">
              <section id="boss-bounty-panel" class="parchment-poster"></section>
              <button id="btn-shop-next" class="wax-contract-cta"></button>
            </div>

            <section id="deck-overview-panel" class="squad-promenade" role="button" tabindex="0" aria-label="查看战团名册">
              <div class="sp-ledger-strip" id="squad-ledger-strip"></div>
              <div class="sp-open-floor" id="squad-roam-zone">
                <div class="sp-hover-tip hidden" id="squad-hover-tip"></div>
              </div>
            </section>
          </aside>

          <!-- RIGHT BAIZE MAT: Mobile-Density Scannable Market Artifacts + On-Demand Detail Inspector -->
          <section class="tabletop-felt-zone">
            <div class="felt-top-header">
              <div class="felt-head-left">
                <span class="felt-title">星界秘宝</span>
                <span class="felt-hint">点选查详规 · 再点确认</span>
              </div>
              <div class="felt-head-right" style="display:flex;gap:8px;align-items:center;">
                <button id="btn-shop-ad-reroll" class="v14-ad-btn"></button>
                <button id="btn-shop-reroll" class="brass-reroll-stamp"></button>
              </div>
            </div>

            <div id="shop-relics-row" class="portrait-relics-row"></div>

            <div class="felt-mid-divider">
              <div class="felt-mid-left">
                <span class="felt-title sm">招募与铭文</span>
              </div>
              <div class="felt-mid-right">
                <span class="felt-title sm teal">战位强化</span>
              </div>
            </div>

            <div id="shop-packs-row" class="tabletop-artifacts-row"></div>
          </section>
        </main>
        <div id="shop-detail-popover" class="shop-detail-popover hidden" role="dialog" aria-label="商品详情与购买确认"></div>
      </div>

      <!-- ═══ v14.1 HERO PREP HALL (10 NEUTRAL HEROES + ORBS + THEME PACKS) ═══ -->
      <div id="deck-select-modal" class="tabletop-contracts-layer hidden">
        <header class="contracts-top-rail">
          <button id="btn-contracts-back" class="steel-btn tavern-btn hud-mini-btn">返回</button>
          <div class="contracts-rail-title" style="display:flex;align-items:center;gap:12px;">
            <h2 class="crt-main">雨夜庭院 · 点将台</h2>
            <span id="meta-orbs-badge" class="v14-orbs-badge">宝珠 10</span>
            <button id="btn-meta-daily-ad" class="v14-ad-btn">每日签到 (领 3~10 碎片)</button>
          </div>
          <div class="contracts-rail-tools" style="display:flex;gap:6px;align-items:center;">
            <span id="meta-sync-badge" class="v15-sync-pill">已保存</span>
            <button id="btn-prep-themes-top" class="steel-btn tavern-btn hud-mini-btn">8大主题包</button>
            <button id="btn-meta-board" class="steel-btn tavern-btn hud-mini-btn">排行榜</button>
            <button id="btn-meta-ach" class="steel-btn tavern-btn hud-mini-btn">成就</button>
            <button id="btn-contracts-hands" class="steel-btn tavern-btn hud-mini-btn">卡池</button>
            <button id="btn-contracts-mute" class="steel-btn tavern-btn hud-mini-btn">音效</button>
          </div>
        </header>
        <div id="deck-select-grid" class="v14-prep-body"></div>
      </div>

      <!-- ═══ SHOWSTOPPER: FULL-SCREEN BOOSTER PACK OPENING CEREMONY ═══ -->
      <div id="pack-ceremony-modal" class="hidden">
        <canvas id="pack-fx-canvas" width="1280" height="720"></canvas>
        <div class="pack-ceremony-hud">
          <div class="pack-header">
            <div id="pack-ceremony-title">秘宝秘匣</div>
            <div id="pack-ceremony-sub"></div>
          </div>
          <div id="pack-sealed-stage"><div id="pack-foil-envelope"></div></div>
          <div id="pack-reveal-stage" class="hidden"><div id="pack-cards-grid"></div></div>
          <div id="pack-target-stage" class="hidden">
            <div id="pack-target-title"></div>
            <div id="pack-target-grid"></div>
            <button id="btn-pack-target-back" class="steel-btn tavern-btn hud-mini-btn">← 返回重选塔罗</button>
          </div>
          <div class="pack-footer" style="display:flex;gap:12px;justify-content:center;">
            <button id="btn-pack-ad-reroll" class="v14-ad-btn">重抽本包 (1/1)</button>
            <button id="btn-pack-abandon" class="steel-btn tavern-btn">放弃本包 (+2G)</button>
          </div>
        </div>
      </div>

      <!-- ═══ v16.5 VICTORY & SETTLEMENT PIXEL VAULT MODAL ═══ -->
      <div id="payout-modal" class="modal-backdrop tavern-backdrop hidden" role="dialog" aria-modal="true" aria-label="讨伐结算">
        <canvas id="po-fx-canvas" class="po-fx-canvas" width="1280" height="720" aria-hidden="true"></canvas>
        <div id="po-card" class="v16-po-vault is-win">
          <div class="v16-po-top-bar" aria-hidden="true"></div>
          <header class="v16-po-head">
            <div id="po-emblem" class="v16-po-emblem"></div>
            <div class="v16-po-head-text">
              <div id="po-kicker" class="v16-po-kicker">WAVE CLEARED</div>
              <div id="po-title" class="v16-po-title">第 1 波讨伐成功</div>
            </div>
            <div id="po-rank-seal" class="v16-po-rank-seal"></div>
          </header>
          <div id="po-boss-banner" class="v16-po-boss-banner"></div>
          <div id="po-rows" class="v16-po-rows"></div>
          <div id="po-total-bar" class="v16-po-total-bar"></div>
          <div id="po-extra-actions" class="v16-po-extra"></div>
          <button id="po-next-btn" class="v16-po-cta">进入酒馆黑市 · 构筑齿轮 →</button>
        </div>
      </div>

      <!-- ═══ ROSTER / CODEX / ACHIEVEMENTS / LEADERBOARD VAULT MODAL ═══ -->
      <div id="roster-modal" class="modal-backdrop tavern-backdrop hidden" role="dialog" aria-modal="true" aria-label="图鉴与殿堂">
        <div class="roster-box tavern-tome-modal">
          <div class="rm-head">
            <div id="rm-tabs-wrap" class="rm-tabs">
              <button id="rm-tab-roster" class="steel-btn tavern-btn rm-tab active">当前牌组</button>
              <button id="rm-tab-hands" class="steel-btn tavern-btn rm-tab">全卡池图鉴</button>
            </div>
            <div id="rm-mode-title" class="rm-mode-title hidden"></div>
            <button id="rm-close-btn" class="steel-btn tavern-btn hud-mini-btn">关闭</button>
          </div>
          <div id="rm-summary"></div>
          <div id="rm-body" tabindex="0"></div>
        </div>
      </div>

      <!-- ═══ REWARDED AD SIMULATOR MODAL (3s placeholder for TapTap IAA SDK) ═══ -->
      <div id="ad-sim-modal" class="modal-backdrop tavern-backdrop hidden" role="dialog" aria-modal="true">
        <div class="v14-ad-modal-box">
          <div class="v14-ad-tag">激励视频广告（原型 3 秒模拟）</div>
          <h3 id="ad-sim-title">正在播放激励视频...</h3>
          <div class="v14-ad-progress-wrap"><div id="ad-sim-bar"></div></div>
          <div id="ad-sim-countdown">剩余 3 秒发放奖励</div>
        </div>
      </div>

      <div id="toast-banner"></div>
    </div>
  </div>

  <!-- Duelyst H5 Kit, MIT pixelfx Procedural VFX Engine & v16.6 Scripts -->
  <script src="./assets/duelyst/duelyst-h5.js?v=197"></script>
  <script src="./assets/duelyst/assets/manifest.js?v=197"></script>
  <script src="./js/pixelfxBundle.js?v=210"></script>
  <script src="./js/audio.js?v=210"></script>
  <script src="./js/vfxPlayer.js?v=210"></script>
  <script src="./js/sprites.js?v=202"></script>
  <script src="./js/v13AltarBg.js?v=144"></script>
  <script src="./js/v14TapBridge.js?v=152"></script>
  <script src="./js/v14Meta.js?v=220"></script>
  <script src="./js/v14Data.js?v=210"></script>
  <script src="./js/v14Engine.js?v=205"></script>
  <script src="./js/v14Battle.js?v=210"></script>
  <script src="./js/v15HeroMusterStage.js?v=234"></script>
  <script src="./js/v15TavernShopStage.js?v=200"></script>
  <script src="./js/v15PackCeremonyFX.js?v=210"></script>
  <script src="./js/v14Main.js?v=233"></script>
</body>
</html>
