<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duelyst · 合成预览</title>
<style>*{box-sizing:border-box}body{background:#141e26;color:#e8efeb;max-width:1080px;margin:auto;padding:clamp(12px,3vw,34px);font:16px/1.55 system-ui}header small{font:700 12px ui-monospace,monospace;color:#97d1bd;letter-spacing:.14em}h1{font-size:clamp(23px,4vw,36px);margin:6px 0}p{margin:6px 0;color:#c4d2d6}canvas{display:block;width:100%;background:#182831;image-rendering:pixelated;border-radius:7px}section{margin:12px 0;background:#202e39;border:1px solid #364952;border-radius:8px;padding:14px}button,select{background:#31434e;border:1px solid #59727d;color:inherit;font:inherit;padding:5px 10px;border-radius:5px;max-width:100%;cursor:pointer}button:focus-visible{outline:2px solid #a7e6c8}.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}input[type=range]{width:100%;accent-color:#8cd4b6}small,output{color:#acc1cc}code{overflow-wrap:anywhere}a{color:#afe0cd}#badge{padding:2px 8px;background:#315044;border-radius:4px}#layers label{padding:2px 7px;overflow-wrap:anywhere}#sources{font-size:.8rem;overflow-wrap:anywhere}#icon{width:42px;height:42px;object-fit:contain;image-rendering:pixelated}#status{color:#f1ce92}label{cursor:pointer}</style>
<style>.unit-embed body{padding:0}.unit-embed header>small,.unit-embed #variant-label,.unit-embed #player-nav,.unit-embed #skills,.unit-embed .owner-picker{display:none}.unit-embed h1{font-size:1.15rem}</style>
