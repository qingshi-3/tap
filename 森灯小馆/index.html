<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a1e"><title>森灯小馆</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<main id="game" aria-label="森灯小馆">
  <header class="topbar"><div id="day"></div><div class="resources"><span id="coins"></span><span id="reputation"></span></div><button class="small" data-panel="settings" aria-label="设置">设置</button></header>
  <section class="world" aria-label="林间餐馆"><canvas id="scene" aria-label="餐馆场景；也可使用下方客人按钮上菜"></canvas><div class="world-caption"><h1>森灯小馆</h1><span id="weather"></span></div><div id="goal" class="goal"></div><div id="service-status" class="service-status"></div><div id="guest-actions" class="guest-actions" aria-label="等候上菜的客人"></div></section>
  <section class="controls"><div id="decisions" class="decisions"></div><div id="phase-actions" class="phase-actions"></div><nav aria-label="经营"><button data-panel="shop"><i class="px-item" style="--pxi:var(--pxi-crate)" aria-hidden="true"></i>采购</button><button data-panel="menu"><i class="px-item" style="--pxi:var(--pxi-eq_tome)" aria-hidden="true"></i>菜单</button><button data-panel="upgrades"><i class="px-item" style="--pxi:var(--pxi-eq_hammer)" aria-hidden="true"></i>升级</button><button data-panel="staff"><i class="px-item" style="--pxi:var(--pxi-chef)" aria-hidden="true"></i>员工</button><button data-panel="goals"><i class="px-item" style="--pxi:var(--pxi-order)" aria-hidden="true"></i>目标</button></nav></section>
</main>
<div id="overlay" class="overlay" hidden><section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"><header class="panel-head"><h2 id="panel-title"></h2><button id="close-panel" class="small" aria-label="关闭面板">关闭</button></header><div id="panel-body" class="panel-body"></div></section></div>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<script type="module" src="js/main.js"></script>
</body></html>
