<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>安全区模拟验证（非真机读数）</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#24150f; }
  iframe { display:block; width:100%; height:100%; border:0; }
  .cutout { position:fixed; z-index:100001; background:#050505; pointer-events:none; }
</style>
<iframe title="安全区模拟游戏" src="/"></iframe>
<script>
  // QA only. This file is excluded from the distributable; production has no simulated insets.
  const query = new URLSearchParams(location.search);
  const edges = ['top','right','bottom','left'];
  const inset = Object.fromEntries(edges.map(edge => [edge, Math.min(100, Math.max(0, Number(query.get(edge)) || 0))]));
  const frame = document.querySelector('iframe');
  frame.addEventListener('load', () => {
    const style = frame.contentDocument.createElement('style');
    style.textContent = `#safe-area-debug-probe { padding:${edges.map(edge=>`${inset[edge]}px`).join(' ')} !important; }`;
    frame.contentDocument.head.append(style);
  });
  for (const edge of edges) {
    if (!inset[edge]) continue;
    const cutout = document.createElement('div');
    cutout.className = 'cutout';
    cutout.dataset.edge = edge;
    cutout.setAttribute('aria-label',`模拟${edge}遮挡`);
    Object.assign(cutout.style, edge==='top'||edge==='bottom'
      ? {[edge]:'0',left:'0',right:'0',height:`${inset[edge]}px`}
      : {[edge]:'0',top:'0',bottom:'0',width:`${inset[edge]}px`});
    document.body.append(cutout);
  }
</script>
</html>
