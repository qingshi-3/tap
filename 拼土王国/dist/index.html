<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#29483d"><title>拼土王国</title><link rel="stylesheet" href="./style.css"></head><body>
<main id="game">
<section class="world" aria-label="领土地图"><div id="viewport"><div id="board" role="grid" aria-label="领土，方向键移动，回车选择"></div></div></section>
<header class="hud"><div class="identity"><h1>拼土王国</h1><span id="season"></span><button id="records">存档</button></div><div id="resources" class="resources"></div></header>
<button id="milestone" aria-label="查看国政"></button>
<div class="map-controls"><button id="zoom-out" aria-label="缩小地图">−</button><button id="center">居中</button><button id="zoom-in" aria-label="放大地图">＋</button></div>
<nav class="map-actions" aria-label="经营操作"><button id="open-land">买地</button><button id="open-building">建造</button><button id="next-turn" class="primary">下一季</button></nav>
<section id="market" role="dialog" aria-modal="false" aria-labelledby="market-title" hidden></section>
<section id="placement" aria-label="放置操作" hidden></section><section id="inspector" aria-label="建筑详情" hidden></section>
<div id="drag-status" role="status" hidden></div><div id="toast" role="status" aria-live="polite"></div>
</main><dialog id="dialog"><div id="dialog-body"></div><button id="close-dialog" class="primary">返回地图</button></dialog><script type="module" src="./app.js"></script></body></html>
