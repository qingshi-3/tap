<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>小小守护者</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0f14'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%234fd6c8'/%3E%3Crect x='1' y='6' width='2' height='4' fill='%234fd6c8'/%3E%3Crect x='13' y='6' width='2' height='4' fill='%234fd6c8'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="/assets/index-BjA40Xkj.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-ClKTNfsC.css">
</head>
<body>
<div id="rotate-hint"><div class="rotate-glyph"></div><p>请横屏游玩</p></div>

<main id="game" aria-label="小小守护者">
  <div id="battlefield" aria-label="战场"></div>
  <div id="vignette" aria-hidden="true"></div>

  <!-- 顶部状态条：常驻，压在角落 -->
  <header id="hud">
    <div class="hud-left">
      <div class="readout core" id="core-readout">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10"/><rect x="1" y="6" width="2" height="4"/><rect x="13" y="6" width="2" height="4"/><rect x="6" y="1" width="4" height="2"/><rect x="6" y="13" width="4" height="2"/></svg>
        <span id="core-health" class="num">100</span>
      </div>
      <div class="readout gold">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="2" width="8" height="12"/><rect x="2" y="5" width="2" height="6" opacity=".55"/><rect x="12" y="5" width="2" height="6" opacity=".55"/></svg>
        <span id="gold" class="num">0</span>
      </div>
      <div class="readout wave"><span class="wave-tag">波次</span><span id="wave" class="num">0 / 7</span></div>
    </div>
    <div class="hud-right">
      <button id="overview-map" class="ibtn" type="button" aria-label="全景地图"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="12"/><rect x="3" y="4" width="4" height="3" class="cut"/><rect x="9" y="8" width="4" height="4" class="cut"/></svg></button>
      <button id="zoom-map" class="ibtn" type="button" aria-label="放大地图" aria-pressed="false"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="7" y="2" width="2" height="12"/><rect x="2" y="7" width="12" height="2"/></svg></button>
      <button id="settings" class="ibtn" type="button" aria-label="暂停与设置"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3" height="12"/><rect x="10" y="2" width="3" height="12"/></svg></button>
    </div>
  </header>

  <!-- 波次路线预告：单入口 -->
  <div id="wave-preview" aria-label="波次路线"></div>

  <!-- 战场上下文面板：跟随选中对象 -->
  <section id="context" hidden aria-label="选中对象"></section>

  <!-- 放置确认条 -->
  <div id="placement" hidden>
    <span id="placement-label">放置</span>
    <button id="confirm-placement" class="pbtn accent" type="button">确认</button>
    <button id="cancel-placement" class="pbtn" type="button">取消</button>
  </div>

  <div id="notice" role="status" aria-live="polite"></div>

  <!-- 底部指令栏：备战=招募，战斗=法术 -->
  <footer id="commands">
    <div id="prep-tools" aria-label="招募"></div>
    <div id="combat-tools" hidden aria-label="法术"></div>
    <div class="command-right">
      <button id="open-shop" class="pbtn shop" type="button">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="6" width="14" height="9"/><rect x="2" y="3" width="12" height="3"/><rect x="6" y="6" width="4" height="4" class="cut"/></svg>
        <span>商店</span>
      </button>
      <button id="start-wave" class="pbtn accent go" type="button">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2 L13 8 L4 14 Z"/></svg>
        <span>开战</span>
      </button>
    </div>
  </footer>
</main>

<!-- 首页 -->
<dialog id="home" class="sheet">
  <div class="sheet-frame">
    <div class="brand">
      <h1>小小守护者</h1>
      <p class="sub">DeepSeek 版 · 无固定路线营地防守</p>
    </div>
    <div class="sheet-actions">
      <button id="continue-game" class="pbtn block" type="button">继续营地</button>
      <div class="seed-row">
        <button id="new-game" class="pbtn block" type="button">新建营地</button>
        <label class="seed-label" for="seed">种子</label>
        <input id="seed" class="seed-input num" type="text" inputmode="numeric" value="20261013" autocomplete="off">
        <button id="seed-game" class="pbtn block" type="button">按种子开局</button>
      </div>
    </div>
    <p id="home-error" class="err"></p>
    <p id="boot-progress" class="note num">正在载入素材…</p>
  </div>
</dialog>

<!-- 商店 -->
<dialog id="shop" class="sheet wide">
  <div class="sheet-frame">
    <div class="sheet-head">
      <h2 id="shop-title">商店</h2>
      <button class="pbtn icon-only" type="button" data-close="shop" aria-label="关闭商店">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="7" width="12" height="2" transform="rotate(45 8 8)"/><rect x="2" y="7" width="12" height="2" transform="rotate(-45 8 8)"/></svg>
      </button>
    </div>
    <div class="shop-body">
      <div id="shop-items"></div>
      <div id="shop-scroll" aria-label="滚动商品" role="scrollbar" tabindex="0"><span>↕</span></div>
    </div>
    <p id="shop-detail" class="note"></p>
  </div>
</dialog>

<!-- 奖励三选一 -->
<dialog id="cards" class="sheet">
  <div class="sheet-frame">
    <div class="sheet-head"><h2>选择一张效果</h2></div>
    <div id="card-choices" class="card-choices"></div>
  </div>
</dialog>

<!-- 暂停 / 设置 -->
<dialog id="pause" class="sheet">
  <div class="sheet-frame">
    <div class="sheet-head"><h2>已暂停</h2></div>
    <div class="sheet-actions">
      <button id="resume" class="pbtn block accent" type="button">继续战斗</button>
      <button id="mute" class="pbtn block" type="button" aria-pressed="false">音效：开</button>
      <button id="motion" class="pbtn block" type="button" aria-pressed="false">动效：开</button>
      <button id="fit-map" class="pbtn block" type="button">全景查看</button>
      <button id="restart-seed" class="pbtn block" type="button">重开本种子</button>
      <button id="back-home" class="pbtn block" type="button">返回首页</button>
    </div>
  </div>
</dialog>

<!-- 结算 -->
<dialog id="result" class="sheet">
  <div class="sheet-frame">
    <div class="sheet-head"><h2 id="result-title">营地守住了</h2></div>
    <p id="result-stats" class="stats-line num"></p>
    <div class="sheet-actions">
      <button id="again" class="pbtn block accent" type="button">再来一局</button>
      <button id="open-replay" class="pbtn block" type="button">查看回放</button>
      <button id="result-home" class="pbtn block" type="button">返回首页</button>
    </div>
  </div>
</dialog>

<!-- 确认 -->
<dialog id="confirm" class="sheet">
  <div class="sheet-frame">
    <div class="sheet-head"><h2 id="confirm-title">确认</h2></div>
    <p id="confirm-copy" class="note"></p>
    <div class="sheet-actions row">
      <button id="confirm-no" class="pbtn" type="button">取消</button>
      <button id="confirm-yes" class="pbtn accent" type="button">确定</button>
    </div>
  </div>
</dialog>

<!-- 图鉴 / 成就 / 回放 -->
<dialog id="collection" class="sheet wide">
  <div class="sheet-frame">
    <div class="sheet-head">
      <h2 id="collection-title">图鉴</h2>
      <button class="pbtn icon-only" type="button" data-close="collection" aria-label="关闭">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="7" width="12" height="2" transform="rotate(45 8 8)"/><rect x="2" y="7" width="12" height="2" transform="rotate(-45 8 8)"/></svg>
      </button>
    </div>
    <div id="collection-content" class="collection-list"></div>
  </div>
</dialog>

</body>
</html>
